<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repaso: Programación orientada a eventos</title>
<style>
:root{--or:#C8531C;--am:#E3A02F;--ol:#6B7A2E;--bu:#7A2A2A;--ca:#3B2418;--cr:#FBF1E1;--cr2:#F6E3C6;--ln:#E2C9A4;--gr:#7A6655;--w:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:16px/1.55 "Segoe UI",system-ui,sans-serif;color:var(--ca);background:var(--cr)}
header{background:var(--ca);color:var(--cr);padding:14px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}header small{color:var(--am);display:block;font-weight:400;font-size:12px;letter-spacing:.08em}
button{font:inherit;cursor:pointer}
.btn{background:var(--or);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:600}
.btn:hover{background:#a8420f}.btn.sec{background:transparent;color:var(--ca);border:2px solid var(--or)}.btn.sec:hover{background:var(--cr2)}
header .btn{padding:6px 12px;font-size:13px}
.layout{display:flex;max-width:1180px;margin:0 auto}
nav{width:210px;flex:none;padding:18px 10px;position:sticky;top:58px;align-self:flex-start;height:calc(100vh - 58px);overflow:auto}
nav button{display:flex;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;padding:9px 10px;margin-bottom:2px;color:var(--ca);border-radius:0 8px 8px 0;align-items:center;gap:6px}
nav button:hover{background:var(--cr2)}nav button.on{background:var(--cr2);border-left-color:var(--or);font-weight:700}
nav .dot{margin-left:auto;width:10px;height:10px;border-radius:50%;background:var(--ln)}nav .dot.ok{background:var(--ol)}
main{flex:1;min-width:0;padding:22px 26px 60px}
.tag{color:var(--or);font-weight:700;letter-spacing:.12em;font-size:13px}
h2{font-size:30px;margin:2px 0 18px}h3{font-size:19px;margin:0 0 10px;color:var(--bu)}
.card{background:var(--w);border:1px solid var(--ln);border-radius:14px;padding:18px 20px;margin:0 0 18px;box-shadow:0 1px 0 var(--ln)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.col{background:var(--cr);border-top:4px solid var(--or);border-radius:8px;padding:10px 14px}
.col:nth-child(2){border-color:var(--am)}.col:nth-child(3){border-color:var(--ol)}.col:nth-child(4){border-color:var(--bu)}
.col b{display:block;margin-bottom:4px}.col ul{margin:0;padding-left:18px}.col li{margin:3px 0}
table{border-collapse:collapse;width:100%;font-size:15px}th{background:var(--ca);color:var(--cr);text-align:left;padding:8px 10px}
td{padding:8px 10px;border-bottom:1px solid var(--ln);vertical-align:top}tr:nth-child(even) td{background:var(--cr)}
.note{background:var(--cr2);border-left:5px solid var(--or);padding:9px 14px;border-radius:0 8px 8px 0;margin-top:12px;font-size:15px}
pre{margin:0;background:#FFF8EC;border:1px solid var(--ln);border-left:5px solid var(--or);border-radius:8px;padding:12px 14px;overflow:auto;font:13.5px/1.5 Consolas,"Courier New",monospace;color:var(--ca);tab-size:4}
.k{color:#9A3412;font-weight:700}.s{color:#4D6B1F}.c{color:#8B7A6B;font-style:italic}.f{color:#7A2A2A}
.out{margin-top:10px;display:none}.out.show{display:block}.out pre{background:#EFF3DC;border-left-color:var(--ol)}
.out .lab,.lab{font-size:12px;letter-spacing:.1em;color:var(--ol);font-weight:700;margin-bottom:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
img.fig{max-width:100%;border-radius:10px;border:1px solid var(--ln);display:block;margin:0 auto}
.cap{text-align:center;color:var(--gr);font-size:14px;margin-top:8px}
.pi{border:1px solid var(--ln);border-radius:10px;padding:12px;margin:0 0 12px;background:var(--cr)}
.pi textarea{width:100%;margin-top:8px;border:1px solid var(--ln);border-radius:8px;padding:8px;font:inherit;min-height:44px;resize:vertical}
.ans{display:none;margin-top:8px;padding:8px 12px;background:#EFF3DC;border-left:5px solid var(--ol);border-radius:0 8px 8px 0}.ans.show{display:block}
input.bl{font:13.5px Consolas,monospace;width:7.2ch;border:0;border-bottom:2px solid var(--or);background:var(--cr2);color:var(--ca);text-align:center;padding:0 2px}
input.bl.ok{background:#DCE8B8;border-color:var(--ol)}input.bl.no{background:#F4C9C2;border-color:var(--bu)}
.q{font-size:19px;font-weight:600;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:left;background:var(--w);border:2px solid var(--ln);border-radius:10px;padding:11px 14px;margin-bottom:9px}
.opt:hover:not(:disabled){border-color:var(--or);background:var(--cr)}
.opt.good{border-color:var(--ol);background:#E4EDC6}.opt.bad{border-color:var(--bu);background:#F4D6D0}.opt:disabled{cursor:default;color:var(--ca)}
.bar{height:10px;background:var(--cr2);border-radius:6px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--or);width:0;transition:width .3s}
.fb{margin-top:10px;padding:10px 14px;border-radius:8px;background:var(--cr2);display:none}.fb.show{display:block}
.score{font-size:54px;font-weight:800;color:var(--or);line-height:1}
.rev{border-left:5px solid var(--ln);padding:6px 12px;margin:10px 0}.rev.ok{border-color:var(--ol)}.rev.no{border-color:var(--bu)}
@media(max-width:760px){.layout{display:block}nav{width:auto;height:auto;position:static;display:flex;overflow:auto;padding:8px}nav button{white-space:nowrap;width:auto;border-left:0;border-bottom:4px solid transparent;border-radius:8px 8px 0 0}nav button.on{border-bottom-color:var(--or)}nav .dot{display:none}main{padding:16px}h2{font-size:24px}}
</style></head><body>
<header><h1><small>PROGRAMACIÓN Y PARADIGMAS COMPUTACIONALES · UAEMéx</small>Repaso: Programación orientada a eventos</h1><button class="btn" id="dl">Descargar HTML</button></header>

<script>
const PARTS=[{"id": "p0", "nav": "Caso inicial", "tag": "CASO INICIAL", "title": "El invernadero que nunca avisa", "blocks": [{"k": "text", "t": "El problema", "cols": [["Situación", ["Un invernadero tiene un sensor de temperatura y un ventilador.", "El programa revisa el sensor sin parar para saber si hay calor.", "Mientras revisa, no puede hacer nada más: ni guardar datos ni mandar correos."]], ["Pregunta", ["¿Cómo harías para que el sensor avise cuando haya calor?", "Se resuelve al final del repaso (Parte 7)."]]]}, {"k": "code", "t": "Sondeo: el programa pregunta una y otra vez", "c": "lecturas = [24, 26, 31, 29, 33]\n\ndef sondeo():\n    revisadas = 0\n    for temp in lecturas:     # pregunta\n        revisadas += 1\n        if temp > 30:\n            print(\"¡calor!\", temp)\n    print(\"revisiones:\", revisadas)\n\nsondeo()", "o": "¡calor! 31\n¡calor! 33\nrevisiones: 5", "n": "Cinco revisiones para encontrar dos alertas. Con miles de sensores sería un desperdicio."}]}, {"id": "p1", "nav": "1 · Eventos", "tag": "PARTE 1", "title": "El paradigma orientado a eventos", "blocks": [{"k": "text", "t": "¿Qué es el paradigma orientado a eventos?", "cols": [["Definición formal", ["El flujo del programa lo determinan eventos", "Un evento es un suceso que el sistema detecta", "El programa reacciona con manejadores"]], ["En palabras simples", ["No preguntas: esperas a que te avisen", "Cuando pasa algo, se ejecuta tu función"]], ["Cómo reconocerlo", ["Funciones que empiezan con “al_” u “on_”", "Registrar una función para después", "Un ciclo que espera sucesos"]]]}, {"k": "text", "t": "Tres analogías", "cols": [["El timbre", ["No abres la puerta cada minuto", "Esperas; al sonar, atiendes"]], ["El mesero", ["Los pedidos llegan en cualquier orden", "Cada pedido tiene su respuesta"]], ["El celular", ["Una notificación es un evento", "Cada app decide qué hacer con ella"]]]}, {"k": "table", "t": "Secuencial frente a por eventos", "head": ["Aspecto", "Secuencial", "Por eventos"], "rows": [["Quién manda", "El programa, línea por línea", "Lo que ocurra afuera"], ["Espera", "Pregunta y bloquea", "Espera sin gastar, y reacciona"], ["Estructura", "Instrucciones en orden", "Manejadores independientes"], ["Extender", "Modificar el flujo", "Agregar un manejador nuevo"], ["Depurar", "Se sigue de arriba abajo", "Hay que seguir quién emitió qué"]], "note": "Ventaja: desacople. Costo: el flujo es menos obvio."}, {"k": "text", "t": "Las cuatro piezas", "cols": [["Evento", ["Un suceso con sus datos", "Ejemplo: temp = 31"]], ["Emisor", ["Quien lo origina", "Sensor, botón, red"]], ["Manejador", ["Función que lo atiende", "Handler o listener"]], ["Ciclo de eventos", ["Espera, toma un evento y lo despacha", "Event loop"]]]}, {"k": "img", "t": "Cómo viaja un evento", "f": "ciclo_eventos.png", "cap": "El ciclo de eventos es el que espera; los manejadores solo se ejecutan cuando llega su evento."}, {"k": "code", "t": "Primer manejador: un diccionario de funciones", "c": "manejadores = {}\n\ndef al_ocurrir(nombre):\n    def registrar(funcion):\n        manejadores.setdefault(nombre, []).append(funcion)\n        return funcion\n    return registrar\n\ndef emitir(nombre, **datos):\n    for funcion in manejadores.get(nombre, []):\n        funcion(**datos)\n\n@al_ocurrir(\"temperatura\")\ndef avisar(grados):\n    if grados > 30:\n        print(\"¡Calor!\", grados)\n\n@al_ocurrir(\"temperatura\")\ndef guardar(grados):\n    print(\"guardado:\", grados)\n\nemitir(\"temperatura\", grados=24)\nemitir(\"temperatura\", grados=33)\nemitir(\"humedad\", valor=80)", "o": "guardado: 24\n¡Calor! 33\nguardado: 33", "n": "Un evento sin manejadores no hace nada: no hay error."}, {"k": "code", "t": "Un bus de eventos propio (EventBus)", "c": "class EventBus:\n    def __init__(self):\n        self._sus = {}\n\n    def suscribir(self, evento, manejador):\n        self._sus.setdefault(evento, []).append(manejador)\n\n    def cancelar(self, evento, manejador):\n        self._sus[evento].remove(manejador)\n\n    def publicar(self, evento, datos=None):\n        for manejador in list(self._sus.get(evento, [])):\n            manejador(datos)\n\nbus = EventBus()\ndef ventilador(t): print(\"ventilador ON\" if t > 30 else \"ventilador OFF\")\ndef registro(t): print(\"log:\", t)\n\nbus.suscribir(\"temp\", ventilador)\nbus.suscribir(\"temp\", registro)\nbus.publicar(\"temp\", 32)\nbus.cancelar(\"temp\", registro)\nbus.publicar(\"temp\", 25)", "o": "ventilador ON\nlog: 32\nventilador OFF", "n": "Quien publica no sabe quién escucha. Quien escucha puede irse con cancelar."}, {"k": "predict", "t": "Actividad 1 · Predice", "intro": "Usa el EventBus de arriba. Escribe tu respuesta antes de ver la clave.", "items": [{"c": "bus = EventBus()\nbus.suscribir(\"a\", lambda d: print(\"1\", d))\nbus.suscribir(\"a\", lambda d: print(\"2\", d))\nbus.publicar(\"a\", 5)", "a": "1 5  y luego  2 5", "w": "Los manejadores se llaman en el orden en que se suscribieron."}, {"c": "bus = EventBus()\nbus.suscribir(\"a\", print)\nbus.publicar(\"b\", 5)", "a": "No imprime nada", "w": "Nadie escucha el evento “b”."}, {"c": "bus = EventBus()\nf = lambda d: print(\"x\", d)\nbus.suscribir(\"a\", f)\nbus.suscribir(\"a\", f)\nbus.cancelar(\"a\", f)\nbus.publicar(\"a\", 5)", "a": "x 5  (una sola vez)", "w": "f se suscribió dos veces y cancelar quita solo la primera."}]}]}, {"id": "p2", "nav": "2 · Callbacks", "tag": "PARTE 2", "title": "Callbacks", "blocks": [{"k": "text", "t": "¿Qué es un callback?", "cols": [["Definición formal", ["Una función que se pasa como argumento", "Otra función la invoca cuando corresponde"]], ["En palabras simples", ["“Llámame cuando termines”", "Dejas tu número y esperas la llamada"]], ["Cómo reconocerlo", ["Una función sin paréntesis como argumento", "Nombres como callback, on_, al_"]]]}, {"k": "code", "t": "Un callback sencillo", "c": "def leer_sensor(al_terminar):\n    temperatura = 31                 # simula la lectura\n    al_terminar(temperatura)         # llama al callback\n\ndef mostrar(t):\n    print(\"llegó:\", t)\n\nleer_sensor(mostrar)\nleer_sensor(lambda t: print(\"doble:\", t * 2))\nprint(list(map(lambda t: t + 1, [20, 21])))   # map también recibe un callback", "o": "llegó: 31\ndoble: 62\n[21, 22]", "n": "mostrar va sin paréntesis: se pasa la función, no su resultado."}, {"k": "code", "t": "Un callback que llega después", "c": "import threading\n\ndef recordatorio():\n    print(\"¡pasaron 0.2 s!\")\n\nthreading.Timer(0.2, recordatorio).start()\nprint(\"sigo trabajando\")", "o": "sigo trabajando\n¡pasaron 0.2 s!", "n": "El callback se ejecuta cuando ocurre el evento (el temporizador), no cuando se registra."}, {"k": "table", "t": "Síncronos y asíncronos", "head": ["", "Síncrono", "Asíncrono"], "rows": [["Cuándo corre", "Durante la llamada", "Más tarde, al ocurrir el evento"], ["Ejemplo", "map, sorted(key=…)", "Temporizador, clic, mensaje de red"], ["Quién lo llama", "La función que lo recibió", "El ciclo de eventos"], ["Errores", "Suben por la pila normal", "Se pierden si nadie los captura"]], "note": "Los callbacks asíncronos son la base de los eventos."}, {"k": "code", "t": "Callbacks anidados frente a async/await", "c": "import asyncio\n\n# Callbacks anidados: cada paso dentro del anterior\ndef leer(cb): cb(31)\ndef decidir(t, cb): cb(t > 30)\ndef actuar(encender, cb):\n    cb(\"ventilador ON\" if encender else \"ventilador OFF\")\n\nleer(lambda t:\n    decidir(t, lambda e:\n        actuar(e, lambda msg: print(msg))))\n\n# Lo mismo con async/await: se lee de arriba abajo\nasync def leer_a(): return 31\nasync def decidir_a(t): return t > 30\nasync def actuar_a(e):\n    return \"ventilador ON\" if e else \"ventilador OFF\"\n\nasync def main():\n    t = await leer_a()\n    e = await decidir_a(t)\n    print(await actuar_a(e))\nasyncio.run(main())", "o": "ventilador ON\nventilador ON", "n": "Misma lógica: tres pasos encadenados. Con await no hay anidación."}, {"k": "table", "t": "Errores comunes con callbacks", "head": ["Error", "Problema", "Corrección"], "rows": [["Llamar en vez de pasar", "f() ejecuta ya", "f pasa la función"], ["Anidar demasiado", "Pirámide difícil de leer", "async/await o funciones con nombre"], ["Olvidar cancelar", "Fugas y llamadas dobles", "Cancelar lo que ya no uses"]], "note": "Regla: pasa la función, no la llames; y cancela lo que ya no uses."}]}, {"id": "p3", "nav": "3 · Excepciones", "tag": "PARTE 3", "title": "Excepciones en eventos y tareas", "blocks": [{"k": "text", "t": "¿Por qué los errores son distintos?", "cols": [["Razones", ["Quien emite el evento no sabe quién lo escucha.", "Un manejador que falla puede impedir que los siguientes se ejecuten.", "En una tarea asíncrona, un error que nadie espera se pierde o aparece tarde."]], ["Principio", ["Cada manejador debe aislar sus errores y reportarlos.", "Un manejador roto no debe tumbar a los demás."]]]}, {"k": "code", "t": "Sin protección: un error corta a los demás", "c": "class EventBus:\n    def __init__(self):\n        self._sus = {}\n    def suscribir(self, evento, f):\n        self._sus.setdefault(evento, []).append(f)\n    def publicar(self, evento, datos=None):\n        for f in self._sus.get(evento, []):\n            f(datos)          # sin try: un error corta a los demás\n\nbus = EventBus()\nbus.suscribir(\"temp\", lambda t: 10 / (t - 30))\nbus.suscribir(\"temp\", lambda t: print(\"bueno recibió\", t))\ntry:\n    bus.publicar(\"temp\", 30)\nexcept ZeroDivisionError:\n    print(\"el segundo manejador nunca se ejecutó\")", "o": "el segundo manejador nunca se ejecutó", "n": "El primer manejador divide entre cero y el segundo ya no corre."}, {"k": "code", "t": "Aislar errores y publicar un evento de error", "c": "class EventBus:\n    def __init__(self):\n        self._sus = {}\n    def suscribir(self, evento, f):\n        self._sus.setdefault(evento, []).append(f)\n    def publicar(self, evento, datos=None):\n        for f in self._sus.get(evento, []):\n            try:\n                f(datos)\n            except Exception as e:\n                print(f\"  ! {f.__name__} falló: {e}\")\n                if evento != \"error\":\n                    self.publicar(\"error\", {\"manejador\": f.__name__,\n                                            \"causa\": e})\n\nbus = EventBus()\ndef malo(t): return 10 / (t - 30)\ndef bueno(t): print(\"  bueno recibió\", t)\nbus.suscribir(\"temp\", malo)\nbus.suscribir(\"temp\", bueno)\nbus.suscribir(\"error\", lambda d: print(\"  registro de error:\", d[\"manejador\"]))\nbus.publicar(\"temp\", 30)", "o": "! malo falló: division by zero\n  registro de error: malo\n  bueno recibió 30", "n": "Cada manejador tiene su propio try; el error se convierte en otro evento."}, {"k": "code", "t": "Errores en tareas asíncronas", "c": "import asyncio\n\nasync def sensor(n):\n    await asyncio.sleep(0.1 * n)\n    if n == 2:\n        raise ValueError(f\"sensor {n} falló\")\n    return f\"sensor {n} ok\"\n\nasync def main():\n    resultados = await asyncio.gather(*(sensor(n) for n in (1, 2, 3)),\n                                      return_exceptions=True)\n    for r in resultados:\n        print(\"ERROR:\" if isinstance(r, Exception) else \"ok:\", r)\n\n    try:\n        async with asyncio.TaskGroup() as grupo:\n            for n in (1, 2, 3):\n                grupo.create_task(sensor(n))\n    except* ValueError as eg:\n        print(\"grupo falló:\", [str(e) for e in eg.exceptions])\nasyncio.run(main())", "o": "ok: sensor 1 ok\nERROR: sensor 2 falló\nok: sensor 3 ok\ngrupo falló: ['sensor 2 falló']", "n": "gather con return_exceptions=True junta todo; TaskGroup cancela al grupo si una tarea falla."}, {"k": "code", "t": "Tiempo límite y cancelación", "c": "import asyncio\n\nasync def lenta():\n    await asyncio.sleep(2)\n    return \"ok\"\n\nasync def main():\n    try:\n        async with asyncio.timeout(0.5):\n            await lenta()\n    except TimeoutError:\n        print(\"se acabó el tiempo\")\n\n    tarea = asyncio.create_task(lenta())\n    await asyncio.sleep(0.1)\n    tarea.cancel()\n    try:\n        await tarea\n    except asyncio.CancelledError:\n        print(\"tarea cancelada\")\nasyncio.run(main())", "o": "se acabó el tiempo\ntarea cancelada", "n": "Una espera sin límite es un error esperando a pasar."}, {"k": "table", "t": "¿Qué hago cuando un manejador falla?", "head": ["Estrategia", "Cuándo usarla", "Cómo"], "rows": [["Aislar y registrar", "Casi siempre", "try/except + log"], ["Publicar evento de error", "Otros deben enterarse", "bus.publicar(\"error\", …)"], ["Reintentar", "Fallas pasajeras (red)", "Bucle con espera"], ["Fallar rápido", "Error de programación", "Dejar que suba"], ["Poner un límite", "Esperas externas", "asyncio.timeout"]], "note": "Nunca uses except: vacío; siempre registra el error."}, {"k": "predict", "t": "Actividad 2 · ¿Qué ocurre?", "intro": "Escribe qué se imprime y si el programa termina con error.", "items": [{"c": "bus.suscribir(\"t\", lambda d: print(\"A\", d))\nbus.suscribir(\"t\", lambda d: 1 / 0)\nbus.suscribir(\"t\", lambda d: print(\"C\", d))\nbus.publicar(\"t\", 1)      # bus SIN try", "a": "Imprime A 1 y falla con ZeroDivisionError", "w": "C nunca se ejecuta: el error corta el ciclo."}, {"c": "async def f(): raise ValueError(\"x\")\nasync def g(): return 1\nr = await asyncio.gather(f(), g(), return_exceptions=True)\nprint(r)", "a": "[ValueError('x'), 1]", "w": "return_exceptions=True devuelve el error como un valor."}, {"c": "async def f(): raise ValueError(\"x\")\nasync def g(): return 1\nr = await asyncio.gather(f(), g())\nprint(r)", "a": "ValueError: nunca imprime", "w": "Sin return_exceptions el primer error sube a quien espera."}]}]}, {"id": "p4", "nav": "4 · asyncio", "tag": "PARTE 4", "title": "Tareas asíncronas con asyncio", "blocks": [{"k": "text", "t": "Las piezas de asyncio", "cols": [["Corrutina", ["Función async def", "Se puede pausar con await"]], ["Tarea (Task)", ["Una corrutina ya programada", "create_task la lanza"]], ["Ciclo de eventos", ["Reparte el turno", "asyncio.run lo crea"]], ["await", ["“Mientras espero, que avance otro”", "Solo dentro de async"]]]}, {"k": "img", "t": "Un hilo, muchas tareas", "f": "asyncio_loop.png", "cap": "Las tareas se alternan en cada await. Nada corre al mismo tiempo; las esperas sí se traslapan."}, {"k": "code", "t": "Varias esperas a la vez: gather", "c": "import asyncio, time\n\nasync def leer_sensor(nombre, espera):\n    await asyncio.sleep(espera)\n    return f\"{nombre}: listo\"\n\nasync def main():\n    inicio = time.perf_counter()\n    r = await asyncio.gather(\n        leer_sensor(\"temperatura\", 0.3),\n        leer_sensor(\"humedad\", 0.5),\n        leer_sensor(\"luz\", 0.2))\n    print(r)\n    print(round(time.perf_counter() - inicio, 1))\nasyncio.run(main())", "o": "['temperatura: listo', 'humedad: listo', 'luz: listo']\n0.5", "n": "Tarda lo que la espera más larga (0.5 s), no la suma (1.0 s)."}, {"k": "code", "t": "Lanzar tareas y seguir trabajando: create_task", "c": "import asyncio\n\nasync def tarea(nombre, seg):\n    await asyncio.sleep(seg)\n    print(nombre, \"terminó\")\n    return nombre\n\nasync def main():\n    t1 = asyncio.create_task(tarea(\"A\", 0.3))\n    t2 = asyncio.create_task(tarea(\"B\", 0.1))\n    print(\"tareas lanzadas, sigo trabajando\")\n    await asyncio.sleep(0)         # cede el turno para que arranquen\n    print(\"resultados:\", await t1, await t2)\nasyncio.run(main())", "o": "tareas lanzadas, sigo trabajando\nB terminó\nA terminó\nresultados: A B", "n": "create_task programa la tarea y devuelve el control de inmediato."}, {"k": "code", "t": "Bloquear el ciclo de eventos", "c": "import asyncio, time\n\nasync def f():\n    await asyncio.sleep(1)       # cede el turno\n\nasync def g():\n    time.sleep(1)                # ¡bloquea todo!\n\nasync def main():\n    t = time.perf_counter()\n    await asyncio.gather(f(), f(), f())\n    print(round(time.perf_counter() - t, 1))\n    t = time.perf_counter()\n    await asyncio.gather(g(), g(), g())\n    print(round(time.perf_counter() - t, 1))\nasyncio.run(main())", "o": "1.0\n3.0", "n": "time.sleep no cede el turno: las tres g() se ejecutan una tras otra."}, {"k": "code", "t": "Productor y consumidor con una cola", "c": "import asyncio\n\nasync def productor(cola):\n    for temp in [24, 31, 33, 28]:\n        await asyncio.sleep(0.1)\n        await cola.put(temp)          # publica un evento\n    await cola.put(None)              # señal de fin\n\nasync def consumidor(cola):\n    while (temp := await cola.get()) is not None:\n        accion = \"ventilador ON\" if temp > 30 else \"ok\"\n        print(\"evento:\", temp, \"→\", accion)\n\nasync def main():\n    cola = asyncio.Queue()\n    await asyncio.gather(productor(cola), consumidor(cola))\nasyncio.run(main())", "o": "evento: 24 → ok\nevento: 31 → ventilador ON\nevento: 33 → ventilador ON\nevento: 28 → ok", "n": "La cola es el buzón de eventos: el productor deja, el consumidor recoge."}, {"k": "code", "t": "Esperar una señal: asyncio.Event", "c": "import asyncio\n\nasync def esperar_alarma(evento):\n    print(\"esperando alarma…\")\n    await evento.wait()\n    print(\"¡alarma recibida!\")\n\nasync def main():\n    alarma = asyncio.Event()\n    t = asyncio.create_task(esperar_alarma(alarma))\n    await asyncio.sleep(0.2)\n    alarma.set()                 # dispara el evento\n    await t\nasyncio.run(main())", "o": "esperando alarma…\n¡alarma recibida!", "n": "set() despierta a todas las tareas que hacen wait()."}, {"k": "code", "t": "Un bus de eventos asíncrono", "c": "import asyncio\nfrom collections import defaultdict\n\nclass BusAsync:\n    def __init__(self):\n        self._sus = defaultdict(list)\n    def suscribir(self, evento, corutina):\n        self._sus[evento].append(corutina)\n    async def publicar(self, evento, datos):\n        await asyncio.gather(*(f(datos) for f in self._sus[evento]),\n                             return_exceptions=True)\n\nasync def ventilador(t):\n    await asyncio.sleep(0.2); print(\"ventilador listo\", t)\nasync def correo(t):\n    await asyncio.sleep(0.3); print(\"correo enviado\", t)\n\nasync def main():\n    bus = BusAsync()\n    bus.suscribir(\"temp\", ventilador)\n    bus.suscribir(\"temp\", correo)\n    await bus.publicar(\"temp\", 33)\nasyncio.run(main())", "o": "ventilador listo 33\ncorreo enviado 33", "n": "Los manejadores esperan al mismo tiempo: tarda 0.3 s, no 0.5 s."}, {"k": "code", "t": "Trabajo bloqueante sin congelar el ciclo", "c": "import asyncio\n\ndef calcular_pesado():\n    return sum(i * i for i in range(2_000_000))\n\nasync def latido():\n    for _ in range(3):\n        print(\"latido\")\n        await asyncio.sleep(0.05)\n\nasync def main():\n    # to_thread manda el trabajo bloqueante a otro hilo\n    tarea = asyncio.to_thread(calcular_pesado)\n    resultado, _ = await asyncio.gather(tarea, latido())\n    print(resultado)\nasyncio.run(main())", "o": "latido\nlatido\nlatido\n2666664666667000000", "n": "to_thread permite usar funciones normales sin bloquear a las demás tareas."}, {"k": "table", "t": "¿Hilos, procesos o asyncio?", "head": ["Situación", "Usa", "Por qué"], "rows": [["Miles de esperas de red", "asyncio", "Un hilo atiende muchas esperas"], ["Biblioteca bloqueante que espera", "asyncio.to_thread", "Evita congelar el ciclo"], ["Cálculo pesado", "ProcessPoolExecutor", "El GIL frena a los hilos"], ["Interfaz gráfica", "Ciclo de eventos propio", "No bloquear nunca el ciclo"]], "note": "Los eventos y asyncio resuelven esperar; los procesos resuelven calcular."}, {"k": "fill", "t": "Práctica 3 · Productor y consumidor", "intro": "Completa los espacios del código y comprueba tus respuestas.", "code": "import asyncio\n\nasync def productor(cola):\n    for n in range(1, 4):\n        await asyncio.sleep(0.1)\n        await cola.{0}(n)\n    await cola.put(None)\n\nasync def consumidor(cola):\n    while (n := await cola.{1}()) is not None:\n        print(\"procesando\", n)\n\nasync def main():\n    cola = asyncio.Queue()\n    await asyncio.{2}(productor(cola), consumidor(cola))\nasyncio.run(main())", "ans": ["put", "get", "gather"], "out": "procesando 1\nprocesando 2\nprocesando 3", "hint": "La cola tiene put y get; para ejecutar dos corrutinas a la vez se usa gather.", "n": "Revisa que: los tres números salen en orden, uno cada 0.1 s."}]}, {"id": "p5", "nav": "5 · Patrones", "tag": "PARTE 5", "title": "Patrones de diseño comunes", "blocks": [{"k": "table", "t": "Seis patrones para sistemas por eventos", "head": ["Patrón", "Problema que resuelve", "En el invernadero"], "rows": [["Observer", "Avisar a muchos cuando algo cambia", "Termómetro avisa a pantalla y alarma"], ["Publicar/Suscribir", "Desacoplar emisores y receptores", "Bus de eventos"], ["Mediator", "Centralizar quién habla con quién", "Controlador que decide ventilador y riego"], ["Command", "Convertir una acción en un objeto", "Abrir ventana con deshacer"], ["State", "Cambiar el comportamiento según el estado", "Reposo, alerta, apagada"], ["Chain of Responsibility", "Pasar el evento hasta que alguien lo atienda", "Normal, aviso, emergencia"]], "note": "Un patrón es una receta: sirve cuando reconoces el problema."}, {"k": "code", "t": "Observer: el sujeto avisa a sus observadores", "c": "class Sujeto:\n    def __init__(self):\n        self._observadores = []\n    def agregar(self, o): self._observadores.append(o)\n    def quitar(self, o): self._observadores.remove(o)\n    def notificar(self, dato):\n        for o in self._observadores:\n            o.actualizar(dato)\n\nclass Termometro(Sujeto):\n    def medir(self, grados):\n        self.notificar(grados)\n\nclass Pantalla:\n    def actualizar(self, g): print(\"pantalla:\", g, \"°C\")\nclass Alarma:\n    def actualizar(self, g):\n        if g > 30: print(\"alarma: ¡calor!\")\n\nt = Termometro()\nt.agregar(Pantalla()); t.agregar(Alarma())\nt.medir(25)\nt.medir(35)", "o": "pantalla: 25 °C\npantalla: 35 °C\nalarma: ¡calor!", "n": "El termómetro conoce a sus observadores, pero no sabe qué hacen."}, {"k": "img", "t": "Publicar y suscribirse con un bus", "f": "pubsub.png", "cap": "El EventBus de la Parte 1 es una implementación de este patrón."}, {"k": "table", "t": "Observer frente a Publicar/Suscribir", "head": ["Aspecto", "Observer", "Publicar/Suscribir"], "rows": [["Intermediario", "No hay", "Un bus o broker"], ["Conocimiento", "El sujeto conoce a sus observadores", "Nadie conoce a nadie"], ["Escala", "Dentro de un programa", "Dentro de un programa o entre sistemas"], ["Ejemplo", "Señales de una ventana", "MQTT, Kafka, EventBus"]], "note": "Mismo objetivo: avisar. Distinto grado de desacople."}, {"k": "code", "t": "Mediator: un controlador decide", "c": "class Mediador:\n    def __init__(self):\n        self.sensor = self.ventilador = self.riego = None\n    def avisar(self, origen, evento, valor):\n        if origen is self.sensor and evento == \"calor\" and valor > 30:\n            self.ventilador.encender()\n        if origen is self.sensor and evento == \"seco\" and valor < 40:\n            self.riego.abrir()\n\nclass Sensor:\n    def __init__(self, m): self.m = m\n    def medir(self, ev, v): self.m.avisar(self, ev, v)\nclass Ventilador:\n    def encender(self): print(\"ventilador ON\")\nclass Riego:\n    def abrir(self): print(\"riego abierto\")\n\nm = Mediador()\nm.sensor, m.ventilador, m.riego = Sensor(m), Ventilador(), Riego()\nm.sensor.medir(\"calor\", 33)\nm.sensor.medir(\"seco\", 35)", "o": "ventilador ON\nriego abierto", "n": "Los dispositivos solo conocen al mediador, no entre ellos."}, {"k": "code", "t": "Command: la acción como objeto (con deshacer)", "c": "class Comando:\n    def ejecutar(self): ...\n    def deshacer(self): ...\n\nclass AbrirVentana(Comando):\n    def __init__(self, inv): self.inv = inv\n    def ejecutar(self): self.inv[\"ventana\"] = \"abierta\"\n    def deshacer(self): self.inv[\"ventana\"] = \"cerrada\"\n\ninvernadero = {\"ventana\": \"cerrada\"}\nhistorial = []\nfor cmd in [AbrirVentana(invernadero)]:\n    cmd.ejecutar(); historial.append(cmd)\nprint(invernadero)\nhistorial.pop().deshacer()\nprint(invernadero)", "o": "{'ventana': 'abierta'}\n{'ventana': 'cerrada'}", "n": "Al ser un objeto, la acción se puede guardar, encolar y deshacer."}, {"k": "code", "t": "State: una máquina de estados con eventos", "c": "from enum import Enum, auto\n\nclass Estado(Enum):\n    REPOSO = auto()\n    ALERTA = auto()\n    APAGADA = auto()\n\nTRANSICIONES = {\n    (Estado.REPOSO, \"calor\"):   Estado.ALERTA,\n    (Estado.ALERTA, \"normal\"):  Estado.REPOSO,\n    (Estado.ALERTA, \"apagar\"):  Estado.APAGADA,\n    (Estado.REPOSO, \"apagar\"):  Estado.APAGADA,\n}\n\nestado = Estado.REPOSO\nfor evento in [\"calor\", \"normal\", \"calor\", \"apagar\", \"calor\"]:\n    nuevo = TRANSICIONES.get((estado, evento))\n    if nuevo is None:\n        print(f\"{estado.name} + {evento}: ignorado\")\n    else:\n        print(f\"{estado.name} + {evento} → {nuevo.name}\")\n        estado = nuevo", "o": "REPOSO + calor → ALERTA\nALERTA + normal → REPOSO\nREPOSO + calor → ALERTA\nALERTA + apagar → APAGADA\nAPAGADA + calor: ignorado", "n": "La misma señal produce efectos distintos según el estado actual."}, {"k": "code", "t": "Chain of Responsibility: quién atiende el evento", "c": "class Manejador:\n    def __init__(self, siguiente=None):\n        self.siguiente = siguiente\n    def atender(self, evento):\n        if self.puede(evento):\n            self.hacer(evento)\n        elif self.siguiente:\n            self.siguiente.atender(evento)\n        else:\n            print(\"nadie atendió:\", evento)\n\nclass Normal(Manejador):\n    def puede(self, e): return e < 30\n    def hacer(self, e): print(e, \"→ normal\")\nclass Aviso(Manejador):\n    def puede(self, e): return e < 40\n    def hacer(self, e): print(e, \"→ aviso por correo\")\nclass Emergencia(Manejador):\n    def puede(self, e): return e >= 40\n    def hacer(self, e): print(e, \"→ ¡emergencia!\")\n\ncadena = Normal(Aviso(Emergencia()))\nfor t in [25, 35, 45]:\n    cadena.atender(t)", "o": "25 → normal\n35 → aviso por correo\n45 → ¡emergencia!", "n": "Cada eslabón decide si atiende o pasa el evento al siguiente."}, {"k": "text", "t": "Patrones que sostienen el ciclo de eventos (avanzado)", "cols": [["Reactor", ["Espera eventos y los despacha", "Es el ciclo de eventos"]], ["Cola de eventos", ["Buzón que desacopla", "asyncio.Queue, colas de mensajes"]], ["Event Sourcing", ["Guardar los eventos, no el estado", "El estado se reconstruye repitiéndolos"]]]}, {"k": "predict", "t": "Actividad 4 · ¿Qué patrón es?", "intro": "Escribe el nombre del patrón y una frase que justifique la elección.", "items": [{"c": "Un botón avisa a tres paneles distintos cuando cambia el tema de color.", "a": "Observer o Publicar/Suscribir", "w": "Un emisor, muchos que reaccionan."}, {"c": "Un editor guarda cada acción para poder deshacer con Ctrl+Z.", "a": "Command", "w": "La acción es un objeto con deshacer."}, {"c": "Un semáforo cambia su comportamiento según esté en rojo, verde o ámbar.", "a": "State", "w": "El comportamiento depende del estado actual."}, {"c": "Una solicitud pasa del soporte nivel 1 al 2 y al 3 hasta que alguien la resuelve.", "a": "Chain of Responsibility", "w": "El evento pasa de uno en uno hasta ser atendido."}]}]}, {"id": "p6", "nav": "6 · Reactiva", "tag": "PARTE 6", "title": "Programación reactiva", "blocks": [{"k": "text", "t": "¿Qué es la programación reactiva?", "cols": [["Definición formal", ["Programación con flujos de datos asíncronos", "Los cambios se propagan solos"]], ["En palabras simples", ["Como una hoja de cálculo: cambia A1 y B1 se actualiza", "Describes qué hacer con el flujo"]], ["Cómo reconocerla", ["Cadenas de .pipe(map, filter, …)", "Observables y suscripciones"]]]}, {"k": "text", "t": "Piezas de la programación reactiva", "cols": [["Observable", ["La fuente del flujo", "Sensor, clics, lista"]], ["Observer", ["Quien recibe los valores", "on_next, on_error, on_completed"]], ["Operadores", ["Transforman el flujo", "map, filter, scan…"]], ["Suscripción", ["Conecta fuente y observer", "subscribe() lo pone a funcionar"]]]}, {"k": "img", "t": "Un flujo y sus operadores (diagrama de canicas)", "f": "canicas.png", "cap": "Cada círculo es un evento en el tiempo. filter descarta, map transforma."}, {"k": "code", "t": "Un Observable mínimo escrito a mano", "c": "class Observable:\n    def __init__(self, suscribirse):\n        self._suscribirse = suscribirse\n    def subscribe(self, al_siguiente):\n        self._suscribirse(al_siguiente)\n    def map(self, f):\n        return Observable(\n            lambda sig: self.subscribe(lambda x: sig(f(x))))\n    def filter(self, p):\n        return Observable(\n            lambda sig: self.subscribe(\n                lambda x: sig(x) if p(x) else None))\n\ndef de_lista(datos):\n    return Observable(lambda sig: [sig(d) for d in datos])\n\nlecturas = de_lista([24, 31, 28, 35, 33])\n(lecturas\n    .filter(lambda t: t > 30)\n    .map(lambda t: f\"{t} °C (!)\")\n    .subscribe(print))", "o": "31 °C (!)\n35 °C (!)\n33 °C (!)", "n": "map y filter son las funciones de orden superior de siempre, aplicadas a un flujo."}, {"k": "code", "t": "Lo mismo con una biblioteca: reactivex", "c": "import reactivex as rx\nfrom reactivex import operators as ops\n\nrx.from_iterable([24, 31, 28, 35, 33]).pipe(\n    ops.filter(lambda t: t > 30),\n    ops.map(lambda t: f\"{t} °C (!)\"),\n).subscribe(on_next=print, on_completed=lambda: print(\"fin\"))", "o": "31 °C (!)\n35 °C (!)\n33 °C (!)\nfin", "n": "Instalar con: pip install reactivex (RxPY 4+). Aparece también on_error."}, {"k": "code", "t": "Operador scan: promedio móvil de 3 lecturas", "c": "import reactivex as rx\nfrom reactivex import operators as ops\n\nrx.from_iterable([20, 22, 30, 34, 32, 26]).pipe(\n    ops.scan(lambda acum, t: acum + [t], []),\n    ops.map(lambda ult: ult[-3:]),\n    ops.map(lambda v: round(sum(v) / len(v), 1)),\n).subscribe(lambda p: print(\"promedio móvil:\", p))", "o": "promedio móvil: 20.0\npromedio móvil: 21.0\npromedio móvil: 24.0\npromedio móvil: 28.7\npromedio móvil: 32.0\npromedio móvil: 30.7", "n": "scan es un reduce que emite cada resultado parcial."}, {"k": "code", "t": "Combinar dos flujos con zip", "c": "import reactivex as rx\nfrom reactivex import operators as ops\n\ntemp = rx.from_iterable([24, 31, 35])\nhum = rx.from_iterable([70, 40, 30])\nrx.zip(temp, hum).pipe(\n    ops.filter(lambda par: par[0] > 30 and par[1] < 45),\n    ops.map(lambda par: f\"calor y seco: {par}\"),\n).subscribe(print)", "o": "calor y seco: (31, 40)\ncalor y seco: (35, 30)", "n": "zip empareja el primer valor de cada flujo, luego el segundo y así sucesivamente."}, {"k": "code", "t": "Errores dentro del flujo: catch", "c": "import reactivex as rx\nfrom reactivex import operators as ops\n\ndef peligroso(t):\n    if t == 0:\n        raise ValueError(\"lectura inválida\")\n    return 100 / t\n\nrx.from_iterable([20, 0, 25]).pipe(\n    ops.map(peligroso),\n    ops.catch(lambda err, src: rx.of(-1)),\n).subscribe(on_next=lambda x: print(\"valor:\", x), on_error=print)", "o": "valor: 5.0\nvalor: -1", "n": "Los errores viajan por el flujo y se manejan con un operador."}, {"k": "code", "t": "Reactivo sin bibliotecas: generadores asíncronos", "c": "import asyncio\n\nasync def sensor():                      # flujo de eventos\n    for t in [24, 31, 28, 35]:\n        await asyncio.sleep(0.05)\n        yield t\n\nasync def main():\n    async for t in sensor():\n        if t > 30:\n            print(\"alerta:\", t)\nasyncio.run(main())", "o": "alerta: 31\nalerta: 35", "n": "async for consume un flujo asíncrono: la forma nativa de Python."}, {"k": "predict", "t": "Actividad 5 · ¿Qué imprime cada flujo?", "intro": "Escribe la salida de cada flujo antes de ver la clave.", "items": [{"c": "rx.from_iterable([1, 2, 3, 4]).pipe(\n    ops.filter(lambda x: x % 2 == 0),\n    ops.map(lambda x: x * 10),\n).subscribe(print)", "a": "20 y 40", "w": "filter deja los pares y map los multiplica por 10."}, {"c": "rx.from_iterable([1, 2, 3, 4]).pipe(\n    ops.scan(lambda a, x: a + x)\n).subscribe(print)", "a": "1, 3, 6 y 10", "w": "scan emite la suma acumulada en cada paso."}, {"c": "rx.from_iterable([5, 6, 7]).pipe(\n    ops.take(2)\n).subscribe(print)", "a": "5 y 6", "w": "take(2) toma dos valores y termina el flujo."}]}, {"k": "table", "t": "¿Cuándo usar cada enfoque?", "head": ["Enfoque", "Úsalo cuando…", "Cuidado"], "rows": [["Callbacks / eventos", "Hay pocos eventos y reglas simples", "Se enreda al crecer"], ["asyncio", "Hay muchas esperas de red o archivos", "No bloquear el ciclo"], ["Programación reactiva", "Hay flujos que se combinan y transforman", "Curva de aprendizaje; depurar es más difícil"], ["Patrones (Observer, State…)", "Quieres estructura mantenible", "No usar sin necesidad"]], "note": "Empieza por lo simple; sube de nivel solo si el problema lo pide."}]}, {"id": "p7", "nav": "7 · Cierre", "tag": "PARTE 7", "title": "Herramientas, cierre y tarea", "blocks": [{"k": "table", "t": "Herramientas para programar con eventos", "head": ["Herramienta", "Para qué sirve", "Nivel"], "rows": [["asyncio", "Tareas asíncronas y ciclo de eventos (incluido en Python)", "Básico"], ["tkinter, PyQt, PySide", "Interfaces gráficas con eventos, señales y slots", "Básico"], ["watchdog", "Eventos del sistema de archivos", "Intermedio"], ["paho-mqtt", "Publicar y suscribirse con sensores (IoT)", "Intermedio"], ["websockets, FastAPI", "Eventos entre navegador y servidor", "Intermedio"], ["reactivex", "Programación reactiva con operadores", "Avanzado"], ["Kafka, RabbitMQ", "Mensajería entre sistemas distribuidos", "Avanzado"]], "note": "Ejecutado en clase: asyncio y reactivex. El resto es ruta de estudio."}, {"k": "text", "t": "De lo básico a lo avanzado", "cols": [["Ruta", ["1. Manejadores con un diccionario y decoradores", "2. EventBus propio: suscribir, publicar, cancelar", "3. Callbacks y su manejo de errores", "4. asyncio: tareas, gather, colas y eventos", "5. Patrones: Observer, Pub/Sub, State, Command", "6. Programación reactiva con reactivex", "7. Sistemas distribuidos: MQTT, Kafka"]]]}, {"k": "code", "t": "Resolvemos el caso: el invernadero", "c": "import asyncio\nfrom collections import defaultdict\n\nclass Bus:\n    def __init__(self):\n        self._sus = defaultdict(list)\n    def suscribir(self, ev, f):\n        self._sus[ev].append(f)\n    async def publicar(self, ev, datos):\n        res = await asyncio.gather(*(f(datos) for f in self._sus[ev]),\n                                   return_exceptions=True)\n        for r in res:\n            if isinstance(r, Exception):\n                print(\"  error aislado:\", r)\n\nasync def ventilador(t):\n    print(\"ventilador\", \"ON\" if t > 30 else \"OFF\")\nasync def log(t):\n    print(\"log\", t)\nasync def correo(t):\n    if t > 34:\n        raise ConnectionError(\"sin red\")\n \nasync def sensor(bus):\n    for t in [26, 32, 36]:\n        await asyncio.sleep(0.1)\n        await bus.publicar(\"temp\", t)\n\nasync def main():\n    bus = Bus()\n    for f in (ventilador, log, correo):\n        bus.suscribir(\"temp\", f)\n    await sensor(bus)\nasyncio.run(main())", "o": "ventilador OFF\nlog 26\nventilador ON\nlog 32\nventilador ON\nlog 36\n  error aislado: sin red", "n": "El sensor avisa; si el correo falla, el ventilador y el log siguen funcionando."}, {"k": "table", "t": "Errores comunes", "head": ["Error", "Corrección"], "rows": [["Preguntar sin parar en vez de esperar eventos", "Hacer que el emisor avise"], ["Llamar al callback al registrarlo: f()", "Pasar la función: f"], ["Un manejador que falla corta a los demás", "try/except por manejador"], ["Usar time.sleep dentro de async", "await asyncio.sleep"], ["Lanzar tareas y olvidar sus errores", "gather o TaskGroup"], ["Manejadores largos que bloquean el ciclo", "Mantenerlos cortos; to_thread"]], "note": null}, {"k": "img", "t": "Todo en una imagen", "f": "mapa.png", "cap": "Los eventos son el centro; todo lo demás son formas de organizarlos."}, {"k": "predict", "t": "Autoevaluación · Predice el resultado", "intro": "", "items": [{"c": "async def f():\n    await asyncio.sleep(1)\n# gather de 3 llamadas a f()\n# ¿cuánto tarda?", "a": "1 segundo", "w": "Las tres esperas ocurren a la vez (verificado: 1.0 s)."}, {"c": "async def g():\n    time.sleep(1)\n# gather de 3 llamadas a g()\n# ¿cuánto tarda?", "a": "3 segundos", "w": "time.sleep bloquea el ciclo (verificado: 3.0 s)."}, {"c": "# Varios objetos deben enterarse\n# cuando otro objeto cambia\n# ¿qué patrón usarías?", "a": "Observer o Publicar/Suscribir", "w": "Un cambio se notifica a varios interesados."}]}, {"k": "text", "t": "Tarea", "cols": [["Para entregar", ["Agrega al EventBus de la Parte 1 un método suscribir_una_vez que cancele el manejador después de su primera llamada.", "Modifica el bus asíncrono para que reintente dos veces un manejador que falle antes de reportar el error.", "Describe en un párrafo qué patrón usarías para un semáforo inteligente y por qué."]], ["Dónde seguir", ["Documentación de Python: módulo asyncio (docs.python.org).", "Documentación de ReactiveX y de reactivex para Python (reactivex.io).", "Gamma, Helm, Johnson y Vlissides. Design Patterns, 1994.", "Manifiesto reactivo (reactivemanifesto.org)."]]]}]}];
const QUIZ=[{"q": "¿Cuál describe mejor a un manejador (handler)?", "o": ["Una función que se ejecuta cuando ocurre su evento", "El sensor que origina el evento", "El ciclo que espera sucesos", "El dato que viaja con el evento"], "e": "El manejador es la función que atiende el evento; el emisor lo origina y el ciclo de eventos lo despacha."}, {"q": "¿Qué diferencia al sondeo (polling) de un programa por eventos?", "o": ["En el sondeo el programa pregunta una y otra vez; con eventos le avisan", "En el sondeo el sensor avisa al programa", "Con eventos el programa revisa cada segundo", "No hay diferencia, solo cambia el nombre"], "e": "En el caso del invernadero, el sondeo hizo 5 revisiones para encontrar 2 alertas."}, {"q": "Con el EventBus de la clase, ¿qué imprime este código?", "code": "bus = EventBus()\nbus.suscribir(\"a\", print)\nbus.publicar(\"b\", 5)", "o": ["Nada, y no hay error", "5", "Un KeyError", "None"], "e": "Nadie escucha el evento \"b\": un evento sin manejadores no hace nada."}, {"q": "Con el EventBus de la clase, ¿cuántas veces se imprime \"x 5\"?", "code": "f = lambda d: print(\"x\", d)\nbus.suscribir(\"a\", f)\nbus.suscribir(\"a\", f)\nbus.cancelar(\"a\", f)\nbus.publicar(\"a\", 5)", "o": ["Una vez", "Dos veces", "Ninguna", "Error al cancelar"], "e": "f se suscribió dos veces y cancelar quita solo la primera."}, {"q": "¿Cuál línea pasa la función como callback (sin ejecutarla)?", "o": ["leer_sensor(mostrar)", "leer_sensor(mostrar())", "leer_sensor(mostrar(31))", "mostrar = leer_sensor()"], "e": "mostrar va sin paréntesis: se pasa la función, no su resultado."}, {"q": "¿Qué se imprime primero?", "code": "threading.Timer(0.2, recordatorio).start()\nprint(\"sigo trabajando\")", "o": ["\"sigo trabajando\"", "\"¡pasaron 0.2 s!\"", "Ambos al mismo tiempo", "Ninguno"], "e": "El callback se ejecuta cuando ocurre el evento (el temporizador), no cuando se registra."}, {"q": "En un bus SIN try/except, el segundo de tres manejadores lanza ZeroDivisionError. ¿Qué pasa con el tercero?", "o": ["Nunca se ejecuta", "Se ejecuta normalmente", "Se ejecuta dos veces", "Python lo reintenta"], "e": "El error corta el ciclo: por eso cada manejador debe aislar sus errores."}, {"q": "¿Qué devuelve gather con return_exceptions=True si una tarea lanza ValueError(\"x\") y otra devuelve 1?", "o": ["[ValueError('x'), 1]", "Solo 1", "Lanza ValueError y no devuelve nada", "[None, 1]"], "e": "return_exceptions=True devuelve el error como un valor dentro de la lista."}, {"q": "Tres llamadas a esta función dentro de asyncio.gather, ¿cuánto tardan?", "code": "async def f():\n    await asyncio.sleep(1)", "o": ["1 segundo", "3 segundos", "0 segundos", "Depende del GIL"], "e": "Las tres esperas se traslapan: tarda lo que la más larga (verificado: 1.0 s)."}, {"q": "Tres llamadas a esta función dentro de asyncio.gather, ¿cuánto tardan?", "code": "async def g():\n    time.sleep(1)", "o": ["3 segundos", "1 segundo", "0.3 segundos", "Lanza un error"], "e": "time.sleep no cede el turno y bloquea el ciclo: se ejecutan una tras otra (verificado: 3.0 s)."}, {"q": "Debes hacer un cálculo pesado que ocupa el procesador. ¿Qué usas?", "o": ["ProcessPoolExecutor", "asyncio.sleep", "asyncio.Queue", "Un callback anidado"], "e": "El GIL frena a los hilos; los procesos resuelven calcular, asyncio resuelve esperar."}, {"q": "Una biblioteca bloqueante espera mucho. ¿Cómo evitas congelar el ciclo de eventos?", "o": ["asyncio.to_thread", "time.sleep", "Llamarla dentro de un bucle while", "Quitar el await"], "e": "to_thread manda el trabajo bloqueante a otro hilo."}, {"q": "Un botón avisa a tres paneles cuando cambia el tema de color. ¿Qué patrón es?", "o": ["Observer (o Publicar/Suscribir)", "Command", "State", "Chain of Responsibility"], "e": "Un emisor y muchos que reaccionan."}, {"q": "Un editor guarda cada acción para poder deshacer con Ctrl+Z. ¿Qué patrón es?", "o": ["Command", "Observer", "Mediator", "State"], "e": "Command convierte la acción en un objeto con ejecutar y deshacer."}, {"q": "Un semáforo cambia su comportamiento según esté en rojo, verde o ámbar. ¿Qué patrón es?", "o": ["State", "Command", "Observer", "Mediator"], "e": "El comportamiento depende del estado actual."}, {"q": "Una solicitud pasa del soporte nivel 1 al 2 y al 3 hasta que alguien la resuelve. ¿Qué patrón es?", "o": ["Chain of Responsibility", "Mediator", "Command", "Observer"], "e": "El evento pasa de uno en uno hasta ser atendido."}, {"q": "¿Qué diferencia a Publicar/Suscribir de Observer?", "o": ["Hay un intermediario (bus o broker) y nadie conoce a nadie", "Publicar/Suscribir solo funciona con hilos", "En Observer hay un intermediario", "Observer no permite varios observadores"], "e": "En Observer el sujeto conoce a sus observadores; en Pub/Sub el bus los desacopla."}, {"q": "En programación reactiva, ¿qué ocurre si armas la tubería pero nunca llamas a subscribe()?", "o": ["No corre: la tubería está armada pero no funciona", "Corre una sola vez", "Lanza TypeError", "Corre en un hilo aparte"], "e": "subscribe() conecta la fuente con el observer y lo pone a funcionar."}, {"q": "¿Qué imprime este flujo?", "code": "rx.from_iterable([1, 2, 3, 4]).pipe(\n    ops.scan(lambda a, x: a + x)\n).subscribe(print)", "o": ["1, 3, 6 y 10", "10", "1, 2, 3 y 4", "1, 2, 4 y 8"], "e": "scan es un reduce que emite cada resultado parcial."}, {"q": "En la máquina de estados de la clase (REPOSO, ALERTA, APAGADA), ¿qué se imprime cuando llega \"calor\" y el estado es APAGADA?", "o": ["APAGADA + calor: ignorado", "APAGADA + calor → ALERTA", "REPOSO + calor → ALERTA", "Lanza KeyError"], "e": "La tabla de transiciones no tiene (APAGADA, \"calor\"): transiciones.get devuelve None y se ignora."}];

  }).join('\n');
}

    if(i>=Q.length)return fin();
    const q=Q[i];
    main.innerHTML='<div class="tag">CUESTIONARIO</div><h2>Pregunta '+(i+1)+' de '+Q.length+'</h2><div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><div class="card"><div class="q">'+esc(q.q)+'</div>'+(q.code?'<pre style="margin-bottom:12px">'+hl(q.code)+'</pre>':'')+q.opts.map((o,k)=>'<button class="opt" data-k="'+k+'">'+'ABCD'[k]+') '+esc(o.t)+'</button>').join('')+'<div class="fb"></div><div class="row"><button class="btn" id="nx" style="display:none">'+(i===Q.length-1?'Ver resultados':'Siguiente →')+'</button></div></div>';
    main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const o=q.opts[+b.dataset.k];main.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(q.opts[k].ok)x.classList.add('good')});
      if(!o.ok)b.classList.add('bad');else sc++;
      res.push({q,pick:o,ok:o.ok});
      const fb=$('.fb');fb.innerHTML='<b>'+(o.ok?'¡Correcto!':'No exactamente.')+'</b> '+esc(q.e);fb.classList.add('show');$('#nx').style.display='';
    });
    $('#nx').onclick=()=>{i++;view()};
  };
  const fin=()=>{
    const pct=Math.round(sc/Q.length*100);done.add('quiz');mark();
    main.innerHTML='<div class="tag">RESULTADOS</div><h2>Terminaste el cuestionario</h2><div class="card"><div class="score">'+sc+' / '+Q.length+'</div><p>'+pct+'% de aciertos. '+(pct>=80?'Excelente: dominas el tema.':pct>=60?'Vas bien: repasa las partes donde fallaste.':'Repasa las partes del temario y vuelve a intentarlo.')+'</p><div class="row"><button class="btn" id="again">Intentar de nuevo</button></div></div><h3>Revisión</h3>'+res.map((r,n)=>'<div class="rev '+(r.ok?'ok':'no')+'"><b>'+(n+1)+'. '+esc(r.q.q)+'</b><br>'+(r.ok?'Correcto: ':'Tu respuesta: '+esc(r.pick.t)+'. Correcta: ')+esc(r.q.o[0])+'<br><small>'+esc(r.q.e)+'</small></div>').join('');
    $('#again').onclick=quiz;
  };
  view();
}
$('#dl').onclick=()=>{const h='<!DOCTYPE html>\n'+document.documentElement.outerHTML;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='Repaso_Programacion_Orientada_a_Eventos.html';a.click()};
show('inicio');
</script></body></html>
